# Security headers for everything nginx serves. These mirror the helmet configuration in server/app.js, which
# only covers responses the API itself sends. Included from every location that sets its own headers, because
# nginx does not inherit add_header across levels once a location adds one.
#
# HSTS (Strict-Transport-Security) belongs on whatever terminates TLS in front of this container.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
