# The whole stack on one machine:  docker compose up --build
#   web  (nginx)      http://localhost:${WEB_PORT:-8080}
#   api  (Node)       internal only
#   db   (PostgreSQL) internal only, data in the `pgdata` volume
#
# Put a TLS terminator (Caddy, a cloud load balancer, ...) in front of `web` for a public site. It adds one more
# proxy hop, so set TRUST_PROXY=2 below in that case.
name: zenitheum

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zenitheum
      POSTGRES_USER: zenitheum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenitheum -d zenitheum"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8787"
      TRUST_PROXY: "1"
      DATABASE_URL: postgres://zenitheum:${POSTGRES_PASSWORD}@db:5432/zenitheum
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-auto}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-true}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-540}
      ANALYTICS_TZ: ${ANALYTICS_TZ:-Asia/Kolkata}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Zenitheum Website <no-reply@zenitheum.com>}
      MAIL_TO_CONTACT: ${MAIL_TO_CONTACT:-support@zenitheum.com}
      MAIL_TO_CAREERS: ${MAIL_TO_CAREERS:-careers@zenitheum.com}

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
